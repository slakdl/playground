<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>havn — menu</title>
<meta name="description" content="Four courses, written after the boats land.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="row">
      <span class="label" data-bind="copyright"></span>
      <nav data-bind="nav-0"></nav>
      <nav data-bind="nav-1"></nav>
      <nav data-bind="nav-2"></nav>
      <nav data-bind="nav-3"></nav>
    </div>
    <div class="row">
      <nav data-bind="sub-0"></nav>
      <nav data-bind="sub-1"></nav>
      <span></span>
      <span></span>
      <nav data-bind="sub-2"></nav>
    </div>
  </header>

  <main>
    <p class="statement" data-bind="intro"></p>

    <section class="sec" id="menu">
      <h2 data-bind="menu-heading"></h2>
      <div class="body" data-bind="menu-body"></div>
    </section>

    <section class="sec" id="wine">
      <h2 data-bind="wine-heading"></h2>
      <div class="body" data-bind="wine-body"></div>
    </section>
  </main>

  <footer class="foot">
    <div data-bind="legal"></div>
    <div data-bind="foot-0"></div>
    <span></span>
    <span></span>
    <div data-bind="foot-1"></div>
  </footer>

<script type="module">
  import { page, $, esc } from "/app.js";

  page("menu.json", (d, site) => {
    document.title = `${site.name.toLowerCase()} — ${d.title.toLowerCase()}`;
    $("intro").textContent = d.intro;

    $("menu-heading").textContent = d.menu.heading;
    $("menu-body").innerHTML =
      `<p>${esc(d.menu.note)}</p>` +
      d.menu.sections.map((s) => `
        <div class="list">
          <h3>${esc(s.title)}</h3>
          <ul>${s.items.map((i) => `<li>${esc(i.name)}</li>`).join("")}</ul>
        </div>`).join("");

    $("wine-heading").textContent = d.wine.heading;
    $("wine-body").innerHTML = `<p>${esc(d.wine.note)}</p>`;
  });
</script>
</body>
</html>
