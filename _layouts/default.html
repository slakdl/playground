<!doctype html>
{%- assign s = site.data.site -%}
<html lang="{{ site.lang }}" class="no-js" style="--bg:{{ s.colors.background | default: '#faf8f4' }};--fg:{{ s.colors.text | default: '#1a1716' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ s.title }}</title>
  <meta name="description" content="{{ s.description }}">
  <script>document.documentElement.className='js'</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/dzidra.css' | relative_url }}">
</head>
<body>
{{ content }}
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
