  - id: about
    nav: About us
    v1_color: "#808BC5"
    v1_title: About us
    v1_cta_label: Instagram
    v1_cta_url: https://www.instagram.com/dzidra_dzidra_dzidra/?hl=da
    body:
      - Dzidra is a neighborhood coffee shop, founded in 2020 by Andreas Skou Albertsen and Isabella Kristensen. We started out with a wish to create a space, where local voices could be amplified and everyone who entered our place, would feel welcomed and seen. The café concept launched in June 2021, and has been evolving ever since. Through different pop-up concepts, poetry readings and art openings, our daily life focuses on bringing heartfelt, homemade food and drinks, to people of the neighborhood.
      - While trying to challenge the nordic pallet with a worldly approach to food, we focus on using only organic farmed vegetables, from local farmers. We offer a wide selection of teas from IO Tehus and coffees and chocolate from La Cabra, natural wines mainly produced by femmes and local organic beer from Herslev Bryghus. And much much more. 4 days a week we turn our daily café into a vibrant and cozy evening restaurant, and it is also possible to rent Dzidra, for a celebration of big mile stones or intimate dinner celebrations.

